<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Size Chart</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        table {
            border-collapse: collapse;
            width: 690px;
            margin: 30px auto;
        }

        th, td {
            border: 1px solid #333;
            padding: 4px;
            text-align: right;
            font-size: 16px;
        }

        th:first-child,
        td:first-child {
            text-align: left;
        }

        thead th {
            background-color: #c45151;
            color: white;
            font-weight: normal;
        }

        tbody tr:nth-child(1) {
            background-color: #d99191;
            color: white;
        }

        tbody tr:nth-child(2) {
            background-color: #f0dada;
        }

        tbody tr:nth-child(3) {
            background-color: #e5e5e5;
        }
    </style>
</head>

<body>

    <table>
        <thead>
            <tr>
                <th>Part</th>
                <th>XS</th>
                <th>S</th>
                <th>M</th>
                <th>L</th>
                <th>XL</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Waist</td>
                <td>25</td>
                <td>28</td>
                <td>30</td>
                <td>31</td>
                <td>32</td>
            </tr>

            <tr>
                <td>Chest</td>
                <td>34</td>
                <td>34</td>
                <td>38</td>
                <td>40</td>
                <td>41</td>
            </tr>

            <tr>
                <td>Sleeve</td>
                <td>23</td>
                <td>24</td>
                <td>24</td>
                <td>25</td>
                <td>25</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
